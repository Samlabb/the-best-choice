services:
  postgres:
    image: postgres:15-alpine
    container_name: thebestchoice-db
    environment:
      POSTGRES_DB: movie_choice_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [thebestchoice-network]

  session:
    build:
      context: .
      dockerfile: session/Dockerfile
    container_name: thebestchoice-session
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/movie_choice_db
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [thebestchoice-network]

  voting:
    build:
      context: .
      dockerfile: voting/Dockerfile
    container_name: thebestchoice-voting
    environment:
      PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/movie_choice_db
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      TMDB_TOKEN: ${TMDB_TOKEN:?set TMDB_TOKEN in .env}
      SESSION_SERVICE_URL: http://session:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [thebestchoice-network]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: thebestchoice-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SESSION_SERVICE_URL: http://session:8081
      VOTING_SERVICE_URL: http://voting:8082
    depends_on:
      session:
        condition: service_healthy
      voting:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [thebestchoice-network]

volumes:
  postgres_data:

networks:
  thebestchoice-network:
    driver: bridge